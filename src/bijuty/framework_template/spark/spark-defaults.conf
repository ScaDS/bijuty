# BiJuTy -- Apache Spark defaults template
# =========================================
#
# Properties set here apply to every spark-submit invocation. Nothing is active
# by default: uncomment the entries you need. FRAMEWORK_* placeholders are
# replaced by BiJuTy from the Configuration Panel.
#
# Reference: https://spark.apache.org/docs/4.1.3/configuration.html

# --- Cluster connection ---
# spark.master                    spark://FRAMEWORK_MASTER_NODE:7077

# --- Parallelism / partitioning ---
# spark.default.parallelism       FRAMEWORK_PARALLELISM
# spark.sql.shuffle.partitions    FRAMEWORK_PARALLELISM

# --- Driver / executor resources (normally set from the Configuration Panel) ---
# spark.driver.memory             FRAMEWORK_MEM_MASTER
# spark.executor.memory           FRAMEWORK_MEM_PER_WORKER
# spark.executor.cores            FRAMEWORK_PARALLELISM_PER_WORKER

# --- Serialization ---
# spark.serializer                org.apache.spark.serializer.KryoSerializer

# --- Shuffle / scratch space and event log ---
# spark.local.dir                 FRAMEWORK_LOCAL_DIR
# spark.eventLog.enabled          true
# spark.eventLog.dir              file://FRAMEWORK_LOG_DIR/events

# --- Metrics (see metrics.properties for available sinks) ---
# spark.metrics.conf              FRAMEWORK_CONF_DIR/metrics.properties

# --- Standalone client mode: wait for the application to finish ---
# spark.standalone.submit.waitAppCompletion true
