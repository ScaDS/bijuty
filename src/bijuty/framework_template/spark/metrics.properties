# BiJuTy -- Apache Spark metrics template
# ========================================
#
# Spark loads this file automatically from SPARK_CONF_DIR. By default the
# built-in MetricsServlet is enabled for the master, worker and driver, so the
# REST endpoints below work without any configuration:
#
#   http://<master>:<ui-port>/metrics/master/json
#   http://<master>:<ui-port>/metrics/applications/json
#
# Uncomment a sink below to export metrics elsewhere.
# Reference: https://spark.apache.org/docs/4.1.3/monitoring.html

# --- Prometheus (scrape http://<host>:<ui-port>/metrics/prometheus) ---
#*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
#*.sink.prometheusServlet.path=/metrics/prometheus

# --- CSV files (handy for offline analysis) ---
#*.sink.csv.class=org.apache.spark.metrics.sink.CsvSink
#*.sink.csv.period=5
#*.sink.csv.unit=seconds
#*.sink.csv.directory=FRAMEWORK_LOG_DIR/metrics

# --- JVM metrics (adds heap/GC metrics to the sources above) ---
#*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
