# =============================================================================
# BEGINNER CONFIGURATION SECTION
# =============================================================================
# Change this ONE value to control all logging: INFO or DEBUG
l# Change this ONE value to control all logging: INFO or DEBUG
property.log.level = INFO

# =============================================================================
# LOG FILE LOCATIONS
# =============================================================================
# Main application logs
property.app.log.dir = FRAMEWORK_LOG_DIR
property.app.log.file = FRAMEWORK_LOG_DIR/app.log

# Spark metrics logs (for performance monitoring)
property.metrics.log.dir = FRAMEWORK_LOG_DIR
property.metrics.log.file = FRAMEWORK_LOG_DIR/metrics.log

# =============================================================================
# APPENDER CONFIGURATIONS
# =============================================================================

# --- Main Application Log Appender ---
# Logs general Spark application messages with timestamps
appender.main.type = File
appender.main.name = MainAppender
appender.main.fileName = ${app.log.file}
appender.main.layout.type = PatternLayout
appender.main.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1}: %m%n%ex
appender.main.createOnDemand = true

# --- Metrics Log Appender ---
# Logs Spark metrics in CSV format for easy analysis
# Format: timestamp,value
appender.metrics.type = File
appender.metrics.name = MetricsAppender
appender.metrics.fileName = ${metrics.log.file}
appender.metrics.layout.type = PatternLayout
appender.metrics.layout.pattern = %d{UNIX_MILLIS},%m%n
appender.metrics.createOnDemand = true

# =============================================================================
# ROOT LOGGER (Controls overall logging level)
# =============================================================================
rootLogger.level = ${log.level}
rootLogger.appenderRef.main.ref = MainAppender

# =============================================================================
# METRICS LOGGER (For collecting Spark performance metrics)
# =============================================================================
logger.metrics.name = org.apache.spark.metrics
logger.metrics.level = INFO
logger.metrics.additivity = false
logger.metrics.appenderRef.metrics.ref = MetricsAppender

# =============================================================================
# NOISE REDUCTION (Quiet down overly verbose components)
# =============================================================================

# Spark internals - keep at WARN to reduce clutter
logger.spark.name = org.apache.spark
logger.spark.level = WARN

# Spark SQL - WARN level to hide query planning details
logger.sparksql.name = org.apache.spark.sql
logger.sparksql.level = WARN

# Spark Scheduler - WARN level for task scheduling info
logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = WARN

# Spark Storage - WARN level for block management
logger.storage.name = org.apache.spark.storage
logger.storage.level = WARN

# Spark Context - WARN level for lifecycle messages
logger.context.name = org.apache.spark.SparkContext
logger.context.level = WARN

# Spark Executor - WARN level for executor messages
logger.executor.name = org.apache.spark.executor.Executor
logger.executor.level = WARN

# Jetty (web server) - reduce noise
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = WARN

# Parquet - only show errors
logger.parquet.name = org.apache.parquet
logger.parquet.level = ERROR

# Kafka - only show warnings and errors
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

# Hive metastore - fatal only to avoid lookup warnings
logger.hive.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hive.level = FATAL

# =============================================================================
# INTERACTIVE SHELL SETTINGS (spark-shell, pyspark)
# =============================================================================
# These control log levels when using interactive shells
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = WARN

logger.thrift.name = org.apache.spark.sql.hive.thriftserver.SparkSQLCLIDriver
logger.thrift.level = WARN

# =============================================================================
# FILTERS (Suppress specific annoying messages)
# =============================================================================
# Hide Thrift server transport errors
appender.main.filter.1.type = RegexFilter
appender.main.filter.1.regex = .*Thrift error occurred during processing of message.*
appender.main.filter.1.onMatch = DENY
appender.main.filter.1.onMismatch = NEUTRAL
